<style>
:root{
  --bg:#0A0A0F; --surface:#141420; --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.18);
  --text:#F2F0E8; --muted:#9A98AC; --cyan:#00E5FF; --magenta:#FF2E88; --lime:#C6FF3D;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg); color:var(--text); font-family:'Archivo',sans-serif;
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px; text-align:center;
}
.logo{height:34px; width:auto; margin-bottom:28px; opacity:0; animation:fadeUp .6s .1s forwards;}
h1{
  font-family:'Unbounded'; font-weight:800; font-size:clamp(24px,4.5vw,34px); letter-spacing:-.01em;
  opacity:0; animation:fadeUp .6s .2s forwards;
}
h1 span{color:var(--cyan);}
p.sub{
  font-family:'Archivo'; font-size:14px; color:var(--muted); margin-top:14px; max-width:440px;
  opacity:0; animation:fadeUp .6s .3s forwards;
}
.status{
  font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); letter-spacing:.06em;
  margin-top:22px; display:flex; align-items:center; gap:10px; opacity:0; animation:fadeUp .6s .4s forwards;
}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-strong); border-top-color:var(--cyan); animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.options{
  display:flex; gap:14px; margin-top:38px; flex-wrap:wrap; justify-content:center;
  opacity:0; animation:fadeUp .6s .5s forwards;
}
.opt{
  font-family:'JetBrains Mono',monospace; font-size:12.5px; letter-spacing:.02em; border:1px solid var(--line-strong);
  color:var(--text); padding:16px 22px; border-radius:12px; transition:.2s; min-width:170px;
  display:flex; flex-direction:column; align-items:center; gap:6px;
}
.opt .flag{font-size:22px;}
.opt .cur{color:var(--muted); font-size:10.5px;}
.opt:hover, .opt:focus-visible{border-color:var(--cyan); color:var(--cyan); transform:translateY(-2px);}
.opt:hover .cur{color:var(--cyan);}
@keyframes fadeUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important;} }
</style>
</head>

<h1>VJING <span>Re-conociendo la mezcla</span></h1>
<p class="sub">Estamos detectando tu ubicación e idioma para mostrarte la versión correcta (precio y moneda cambian según la región). También podés elegir manualmente.</p>

<div class="status" id="status"><span class="spin"></span><span id="status-text">Detectando región…</span></div>

<div class="options">
  <a class="opt" href="ar/index.html" data-target="ar"><span class="flag">🇦🇷</span>Argentina<span class="cur">ARS</span></a>
  <a class="opt" href="latam/index.html" data-target="latam"><span class="flag">🌎</span>Español (Latam)<span class="cur">USD</span></a>
  <a class="opt" href="en/index.html" data-target="en"><span class="flag">🇬🇧</span>English<span class="cur">USD</span></a>
</div>

<script>
// Si el usuario hace click en cualquier opción manual, cancelamos cualquier redirección pendiente.
let redirected = false;
document.querySelectorAll('.opt').forEach(a=>{
  a.addEventListener('click', ()=>{ redirected = true; });
});

function goTo(target){
  if(redirected) return;
  redirected = true;
  window.location.href = target + '/index.html';
}

function setStatus(text){
  const el = document.getElementById('status-text');
  if(el) el.textContent = text;
}

function decideByLanguage(){
  const lang = (navigator.language || 'es').toLowerCase();
  if(lang.startsWith('es')){
    setStatus('Te llevamos a la versión en español para Latam…');
    setTimeout(()=>goTo('latam'), 900);
  } else {
    setStatus('Taking you to the English version…');
    setTimeout(()=>goTo('en'), 900);
  }
}

// Detección por IP con timeout corto; si falla, cae a idioma del navegador.
const controller = new AbortController();
const timeoutId = setTimeout(()=>controller.abort(), 2500);

fetch('https://ipapi.co/json/', {signal: controller.signal})
  .then(r=>r.json())
  .then(data=>{
    clearTimeout(timeoutId);
    const country = (data && data.country_code) ? data.country_code.toUpperCase() : null;
    if(country === 'AR'){
      setStatus('Te llevamos a la versión Argentina…');
      setTimeout(()=>goTo('ar'), 900);
    } else if(country){
      decideByLanguage();
    } else {
      decideByLanguage();
    }
  })
  .catch(()=>{
    clearTimeout(timeoutId);
